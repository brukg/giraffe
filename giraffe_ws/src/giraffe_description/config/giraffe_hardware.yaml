# @format
---
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - finger_actuator_gripper_joint

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - shoulder_pan_actuator_shoulder_pan_joint
        - shoulder_lift_actuator_shoulder_lift_joint
        - elbow_actuator_elbow_joint
        - wrist_1_actuator_wrist_1_joint
        - wrist_2_actuator_wrist_2_joint
      publish_rate: 100
      write_op_modes:
        - shoulder_pan_actuator_shoulder_pan_joint
        - shoulder_lift_actuator_shoulder_lift_joint
        - elbow_actuator_elbow_joint
        - wrist_1_actuator_wrist_1_joint
        - wrist_2_actuator_wrist_2_joint

joint_state_broadcaster:
  ros__parameters:
    joints:
      - shoulder_pan_actuator_shoulder_pan_joint
      - shoulder_lift_actuator_shoulder_lift_joint
      - elbow_actuator_elbow_joint
      - wrist_1_actuator_wrist_1_joint
      - wrist_2_actuator_wrist_2_joint
      - finger_actuator_gripper_joint
    publish_rate: 100

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_actuator_shoulder_pan_joint
      - shoulder_lift_actuator_shoulder_lift_joint
      - elbow_actuator_elbow_joint
      - wrist_1_actuator_wrist_1_joint
      - wrist_2_actuator_wrist_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    gains:
      shoulder_pan_actuator_shoulder_pan_joint:
        { p: 100.0, i: 0.0, d: 0.01, i_clamp: 0.0 }
      shoulder_lift_actuator_shoulder_lift_joint:
        { p: 100.0, i: 0.0, d: 0.01, i_clamp: 0.0 }
      elbow_actuator_elbow_joint: { p: 100.0, i: 0.0, d: 0.01, i_clamp: 0.0 }
      wrist_1_actuator_wrist_1_joint:
        { p: 100.0, i: 0.0, d: 0.01, i_clamp: 0.0 }
      wrist_2_actuator_wrist_2_joint:
        { p: 100.0, i: 0.0, d: 0.01, i_clamp: 0.0 }
    state_publish_rate: 100.0
    state_publish_topic: controller_state
    action_monitor_rate: 50.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.2
      shoulder_pan_actuator_shoulder_pan_joint: { trajectory: 0.4, goal: 0.1 }
      shoulder_lift_actuator_shoulder_lift_joint: { trajectory: 0.4, goal: 0.1 }
      elbow_actuator_elbow_joint: { trajectory: 0.4, goal: 0.1 }
      wrist_1_actuator_wrist_1_joint: { trajectory: 0.4, goal: 0.1 }
      wrist_2_actuator_wrist_2_joint: { trajectory: 0.4, goal: 0.1 }

gripper_controller:
  ros__parameters:
    joints:
      - finger_actuator_gripper_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

    gains:
      finger_actuator_gripper_joint: { p: 100.0, i: 0.0, d: 0.01, i_clamp: 0.0 }
    state_publish_topic: controller_state
    open_loop_control: true
    state_publish_rate: 100.0
    action_monitor_rate: 50.0
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: false

    constraints:
      stopped_velocity_tolerance: 0.2
      finger_actuator_gripper_joint: { trajectory: 0.4, goal: 0.4 }
